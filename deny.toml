[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    # Dos crates del portapapeles de Windows que trae la interfaz egui
    # (clipboard-win, error-code); licencia permisiva, ADR-0004.
    "BSL-1.0",
    # Las fuentes que incrusta egui (epaint_default_fonts): son fuentes, no
    # código, y se redistribuyen con su licencia.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# LGPL se permite solo para OCCT y netgen, enlazados como bibliotecas
# separadas y declarados en ATTRIBUTION.md. Nunca en crates propios.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
