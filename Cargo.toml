[workspace]
resolver = "3"
members = [
    "crates/hm-core",
    "crates/hm-units",
    "crates/hm-math",
    "crates/hm-formula",
    "crates/hm-project",
    "crates/hm-cli",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Jorge Viloria and contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
