[workspace]
resolver = "3"
# hm-ui-egui es la interfaz, todavía en prueba, con su propio workspace;
# no entra en el CI principal.
exclude = ["crates/hm-ui-egui"]
members = [
    "crates/hm-core",
    "crates/hm-units",
    "crates/hm-math",
    "crates/hm-formula",
    "crates/hm-design",
    "crates/hm-bench",
    "crates/hm-project",
    "crates/hm-engine",
    "crates/hm-cli",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Jorge Viloria and contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
