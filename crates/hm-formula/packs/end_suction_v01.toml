# Pack de diseño preliminar para bombas end-suction OH1/OH2.
#
# Las fórmulas reproducen el ejemplo resuelto D1.A1 de Srinivasan 2017
# con las selecciones documentadas en hm-design. Las unidades se escriben
# con el parser de hm-units.

[[formula]]
id = "design.hydraulic_efficiency"
version = 1
validation = "reference"
module = "design"
title = "Eficiencia hidráulica"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "1"
range = "0.5 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::hydraulic_efficiency"

[formula.inputs]
Dn = "1"

[formula.expr]
value = "1 - 0.42/(log10(Dn) - 0.172)^2"

[formula.notes]
assumptions = "Dn es el diámetro específico en mm como número adimensional: Dn = A*1000*(Q/n_rpm)^(1/3), con A entre 4.0 y 4.5."

[[formula]]
id = "design.volumetric_efficiency"
version = 1
validation = "reference"
module = "design"
title = "Eficiencia volumétrica"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "1"
range = "0.8 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::volumetric_efficiency"

[formula.inputs]
nq = "1"

[formula.expr]
value = "1/(1 + 0.68*exp(ln(3.65*nq)*(-2/3)))"

[formula.notes]
assumptions = "nq es la velocidad específica europea, sin el factor 3.65; el 3.65 convierte a ns."

[[formula]]
id = "design.overall_efficiency"
version = 1
validation = "reference"
module = "design"
title = "Eficiencia total"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "1"
range = "0.3 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::overall_efficiency"

[formula.inputs]
eta_h = "1"
eta_v = "1"
eta_m = "1"

[formula.expr]
value = "eta_h*eta_v*eta_m"

[formula.notes]
assumptions = "Producto de eficiencias hidráulica, volumétrica y mecánica."

[[formula]]
id = "design.u2"
version = 1
validation = "reference"
module = "design"
title = "Velocidad periférica de diseño"
source = "Srinivasan 2017, Diseño D1.A1, p. 415; Gülich 2020, cap. 3"
units = "m/s"
range = "0 .. 200"
test = "crates/hm-formula/tests/end_suction.rs::u2"

[formula.inputs]
H = "m"
psi = "1"

[formula.expr]
value = "sqrt(2*g*H/psi)"

[formula.notes]
assumptions = "psi = 2gH/u2^2. Con psi=0.87 reproduce u2=17.64 m/s del ejemplo D1.A1."

[[formula]]
id = "design.d2"
version = 1
validation = "reference"
module = "design"
title = "Diámetro exterior del impulsor"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "m"
range = "0 .. 2"
test = "crates/hm-formula/tests/end_suction.rs::d2"

[formula.inputs]
H = "m"
n = "1/s"
psi = "1"

[formula.expr]
value = "sqrt(2*g*H/psi)/(pi*n)"

[formula.notes]
assumptions = "D2 = u2/(pi*n) con n en 1/s; equivale a 60*u2/(pi*n_rpm). Con H=13.8 m, n=1800 rpm y psi=0.87 da 0.1872 m."

[[formula]]
id = "design.qth"
version = 1
validation = "reference"
module = "design"
title = "Caudal teórico"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "m3/s"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::qth"

[formula.inputs]
Q = "m3/s"
eta_v = "1"

[formula.expr]
value = "Q/eta_v"

[formula.notes]
assumptions = "Incluye la fuga por la holgura de desgaste; Qth = Q/eta_v."

[[formula]]
id = "design.cm2"
version = 1
validation = "reference"
module = "design"
title = "Velocidad meridional de salida"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "m/s"
range = "0 .. 30"
test = "crates/hm-formula/tests/end_suction.rs::cm2"

[formula.inputs]
phi = "1"
u2 = "m/s"

[formula.expr]
value = "phi*u2"

[formula.notes]
assumptions = "phi = cm2/u2. Con phi=0.13 y u2=17.64 m/s da 2.29 m/s."

[[formula]]
id = "design.b2"
version = 1
validation = "reference"
module = "design"
title = "Ancho de salida del impulsor"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "m"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::b2"

[formula.inputs]
Qth = "m3/s"
D2 = "m"
cm2 = "m/s"

[formula.expr]
value = "Qth/(pi*D2*cm2)"

[formula.notes]
assumptions = "Continuidad en la salida, sin bloqueo de álabes. Con Qth=0.0165 m3/s, D2=0.1872 m y cm2=2.29 m/s da 0.0122 m."

[[formula]]
id = "design.d0"
version = 1
validation = "reference"
module = "design"
title = "Diámetro de ojo"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "m"
range = "0 .. 2"
test = "crates/hm-formula/tests/end_suction.rs::d0"

[formula.inputs]
Qth = "m3/s"
c0 = "m/s"

[formula.expr]
value = "sqrt(4*Qth/(pi*c0))"

[formula.notes]
assumptions = "c0 es la velocidad en el ojo. Con c0=3.6 m/s da D0=0.0764 m."

[[formula]]
id = "design.d1"
version = 1
validation = "reference"
module = "design"
title = "Diámetro de entrada del álabe"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "m"
range = "0 .. 2"
test = "crates/hm-formula/tests/end_suction.rs::d1"

[formula.inputs]
D0 = "m"
J = "1"

[formula.expr]
value = "J*D0"

[formula.notes]
assumptions = "J=1.03 en D1.A1."

[[formula]]
id = "design.b1"
version = 1
validation = "reference"
module = "design"
title = "Ancho de entrada del álabe"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "m"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::b1"

[formula.inputs]
Qth = "m3/s"
D1 = "m"
cm0 = "m/s"

[formula.expr]
value = "Qth/(pi*D1*cm0)"

[formula.notes]
assumptions = "cm0=2.25 m/s en D1.A1; reproduce B1=0.0296 m."

[[formula]]
id = "design.shaft_power"
version = 1
validation = "reference"
module = "design"
title = "Potencia en el eje"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "W"
range = "0 .. 100000000"
test = "crates/hm-formula/tests/end_suction.rs::shaft_power"

[formula.inputs]
P_hyd = "W"
eta = "1"

[formula.expr]
value = "P_hyd/eta"

[formula.notes]
assumptions = "Potencia hidráulica dividida por la eficiencia total."

[[formula]]
id = "design.max_power"
version = 1
validation = "reference"
module = "design"
title = "Potencia máxima de diseño"
source = "Srinivasan 2017, Diseño D1.A1, p. 415"
units = "W"
range = "0 .. 100000000"
test = "crates/hm-formula/tests/end_suction.rs::max_power"

[formula.inputs]
P_shaft = "W"
margin = "1"

[formula.expr]
value = "P_shaft*margin"

[formula.notes]
assumptions = "Margen 1.1 sobre la potencia en el eje, como en D1.A1 (2.93 kW frente a 2.666 kW)."

[[formula]]
id = "design.volute_base_radius"
version = 1
validation = "reference"
module = "design"
title = "Radio de la base de la voluta"
source = "Srinivasan 2017, ec. 5.7, p. 146; D2.2, p. 450"
units = "m"
range = "0 .. 2"
test = "crates/hm-formula/tests/end_suction.rs::volute_base_radius"

[formula.inputs]
D2 = "m"
k3 = "1"

[formula.expr]
value = "k3*D2/2"

[formula.notes]
assumptions = "R3 = (1.03..1.05) R2; se usa k3=1.04. En D2.2, R3=0.099 m."

[[formula]]
id = "design.volute_width"
version = 1
validation = "reference"
module = "design"
title = "Ancho de la voluta"
source = "Srinivasan 2017, ec. 5.8, p. 146; D2.2, p. 450"
units = "m"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::volute_width"

[formula.inputs]
B2 = "m"
D2 = "m"
c = "1"

[formula.expr]
value = "B2 + c*D2"

[formula.notes]
assumptions = "b3 = b2 + (0.04..0.05) D2; se usa c=0.05. En D2.2, B3=0.022 m."

[[formula]]
id = "design.volute_inlet_velocity"
version = 1
validation = "reference"
module = "design"
title = "Velocidad absoluta a la entrada de la voluta"
source = "Srinivasan 2017, D2.2, p. 450"
units = "m/s"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::volute_inlet_velocity"

[formula.inputs]
cm2 = "m/s"
cu2 = "m/s"

[formula.expr]
value = "sqrt(cm2^2 + cu2^2)"

[formula.notes]
assumptions = "C3 = sqrt(cm2^2 + cu2^2). En D2.2, C3=12.089 m/s con su triángulo de velocidades."

[[formula]]
id = "design.volute_throat_area"
version = 1
validation = "reference"
module = "design"
title = "Área de garganta de la voluta"
source = "Srinivasan 2017, D2.2, p. 451"
units = "m2"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::volute_throat_area"

[formula.inputs]
Q = "m3/s"
C3 = "m/s"

[formula.expr]
value = "Q/C3"

[formula.notes]
assumptions = "A360=Q/C3. En D2.2, A=0.0013 m2 con C3=12.089 m/s."

[[formula]]
id = "design.volute_throat_area_ratio"
version = 1
validation = "pilot"
module = "design"
title = "Área de la garganta de la voluta por razón de deceleración c3q/c2"
source = "Gülich 2020, ec. (T7.7.11), p. 507, y tabla 10.2, p. 729"
units = "m2"
range = "0 .. 10"
test = "crates/hm-formula/tests/end_suction.rs::volute_throat_area_ratio"

[formula.inputs]
Q = "m3/s"
c2 = "m/s"
ratio = "1"

[formula.expr]
value = "Q/(ratio*c2)"

[formula.notes]
assumptions = "A3q = Q_Le/(zLe·c3q) con c3q = ratio·c2 y zLe = 1. Con ratio = 1 es la fórmula de Srinivasan (A = Q/C3). Gülich pide c3q/c2 «no mucho menor que 0,8» (tabla 10.2, fila 9; óptimo ≈ 0,8 en la p. 180; banda 0,7–0,85 en la p. 508)."

[[formula]]
id = "design.volute_momentum_throat_diameter"
version = 1
validation = "pilot"
module = "design"
title = "Diámetro de la garganta circular por conservación del momento cinético"
source = "Gülich 2020, tabla 7.7, ec. (7.7.7), p. 505"
units = "m"
range = "0 .. 5"
test = "crates/hm-formula/tests/end_suction.rs::volute_momentum_throat_diameter"

[formula.inputs]
Q = "m3/s"
c2u = "m/s"
r2 = "m"
dz = "m"
eps_sp = "1"

[formula.expr]
value = "Q/(pi*c2u*r2)*eps_sp/(2*pi) + sqrt(2*dz*(Q/(pi*c2u*r2)*eps_sp/(2*pi)))"

[formula.notes]
assumptions = "X = Q_Le/(π c2u r2)·εsp/2π y d3q = X + √(2 dz' X) para una sección circular o el círculo equivalente de una sección cualquiera (A3q = π d3q²/4). dz' es el diámetro del punto de remanso: dz + e3, con e3 ≈ 0,02·d2. εsp = 2π en una voluta simple. Se usa como contraste, no para dimensionar."

[[formula]]
id = "design.volute_throat_diameter"
version = 1
validation = "reference"
module = "design"
title = "Diámetro efectivo de garganta"
source = "Srinivasan 2017, D2.2, p. 451"
units = "m"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::volute_throat_diameter"

[formula.inputs]
A360 = "m2"
k_eff = "1"

[formula.expr]
value = "k_eff*sqrt(4*A360/pi)"

[formula.notes]
assumptions = "D_eff=1.1 D para compensar lengua y redondeo. En D2.2, D_eff=0.0452 m."

[[formula]]
id = "design.volute_outer_radius"
version = 1
validation = "reference"
module = "design"
title = "Radio exterior de la voluta"
source = "Srinivasan 2017, D2.2, p. 451"
units = "m"
range = "0 .. 2"
test = "crates/hm-formula/tests/end_suction.rs::volute_outer_radius"

[formula.inputs]
R3 = "m"
D360 = "m"

[formula.expr]
value = "R3 + D360/2"

[formula.notes]
assumptions = "Radio exterior de la sección de garganta. En D2.2, R4=0.1216 m."

[[formula]]
id = "design.hydraulic_loss"
version = 1
validation = "reference"
module = "design"
title = "Pérdida hidráulica"
source = "Descomposición de la cadena de eficiencias; Srinivasan 2017, D1.A1"
units = "W"
range = "0 .. 100000000"
test = "crates/hm-formula/tests/end_suction.rs::hydraulic_loss"

[formula.inputs]
P_hyd = "W"
eta_h = "1"

[formula.expr]
value = "P_hyd*(1/eta_h - 1)"

[formula.notes]
assumptions = "Pérdida implícita en la eficiencia hidráulica; no es una predicción independiente."

[[formula]]
id = "design.volumetric_loss"
version = 1
validation = "reference"
module = "design"
title = "Pérdida volumétrica"
source = "Descomposición de la cadena de eficiencias; Srinivasan 2017, D1.A1"
units = "W"
range = "0 .. 100000000"
test = "crates/hm-formula/tests/end_suction.rs::volumetric_loss"

[formula.inputs]
P_hyd = "W"
eta_h = "1"
eta_v = "1"

[formula.expr]
value = "P_hyd/eta_h*(1/eta_v - 1)"

[formula.notes]
assumptions = "Potencia extra para bombear la fuga; se calcula después de la pérdida hidráulica."

[[formula]]
id = "design.mechanical_loss"
version = 1
validation = "reference"
module = "design"
title = "Pérdida mecánica"
source = "Descomposición de la cadena de eficiencias; Srinivasan 2017, D1.A1"
units = "W"
range = "0 .. 100000000"
test = "crates/hm-formula/tests/end_suction.rs::mechanical_loss"

[formula.inputs]
P_hyd = "W"
eta_h = "1"
eta_v = "1"
eta_m = "1"

[formula.expr]
value = "P_hyd/(eta_h*eta_v)*(1/eta_m - 1)"

[formula.notes]
assumptions = "Incluye cojinetes, cierre y fricción de disco agrupados en eta_m."

[[formula]]
id = "design.specific_diameter"
version = 1
validation = "reference"
module = "design"
title = "Diámetro específico"
source = "Srinivasan 2017, D1.A1, p. 415"
units = "1"
range = "20 .. 500"
test = "crates/hm-formula/tests/end_suction.rs::specific_diameter"

[formula.inputs]
A = "1"
Q = "m3/s"
n = "1/s"
mm = "m"

[formula.expr]
value = "A*(Q/(60*n))^(1/3)/mm"

[formula.notes]
assumptions = "Devuelve Dn en mm como número adimensional; mm=0.001 m. En D1.A1 da 93,2."

[[formula]]
id = "design.thoma_sigma"
version = 1
validation = "pilot"
module = "design"
title = "Coeficiente de Thoma"
source = "Srinivasan 2017, ec. (9.19b), p. 241; Gülich 2020, ec. (6.7) y tabla D6.1, p. 320"
units = "1"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::thoma_sigma"

[formula.inputs]
nq = "1"

[formula.expr]
value = "0.0012*nq^(4/3)"

[formula.notes]
assumptions = "σ = ns^(4/3)/4700 con ns = 3,65 nq (Srinivasan) da 0,0012 nq^(4/3). Equivale a una velocidad específica de succión nss ≈ 155, algo por debajo del rango 160..220 de Gülich para rodetes estándar: es conservadora. D1.A1 no da NPSH; no hay contraste publicado."

[[formula]]
id = "design.npshr_design"
version = 1
validation = "pilot"
module = "design"
title = "NPSH requerido en el punto de diseño"
source = "Definición de σ: Srinivasan 2017, ec. (2.22), p. 21 y ec. (9.19b), p. 241"
units = "m"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::npshr_design"

[formula.inputs]
sigma = "1"
H = "m"

[formula.expr]
value = "sigma*H"

[formula.notes]
assumptions = "NPSHr = σH con σ de design.thoma_sigma. Para D1.A1 da 1,67 m, pero el libro no publica NPSH de ese diseño: es un valor calculado, no de referencia."

[[formula]]
id = "design.shutoff_head"
version = 2
validation = "pilot"
module = "design"
title = "Altura a caudal cero"
source = "Gülich 2020, ec. (3.28), p. 131"
units = "m"
range = "0 .. 5000"
test = "crates/hm-formula/tests/end_suction.rs::shutoff_head"

[formula.inputs]
nq = "1"
u2 = "m/s"

[formula.expr]
value = "1.25*exp(-0.3*nq/100)*u2^2/(2*g)"

[formula.notes]
assumptions = "Coeficiente de presión a caudal cero de bombas de voluta, ψo = 1,25 exp(−0,3 nq/100), y H0 = ψo u2²/2g. En D1.A1 da 18,0 m frente a ≈19 m de la Fig. D1.A2 de Srinivasan (−5 %)."

[[formula]]
id = "design.slip_factor"
version = 3
validation = "pilot"
module = "design"
title = "Factor de deslizamiento"
source = "Gülich 2020, tabla 3.2, ec. (3.2.6) y (3.2.4), p. 152 (Wiesner con f1 = 0,98)"
units = "1"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::slip_factor"

[formula.inputs]
beta2 = "deg"
Z = "1"
eps = "1"

[formula.expr]
value = "0.98*(1 - sqrt(sin(beta2))/Z^0.7)*(1 - (max(eps - exp(-8.16*sin(beta2)/Z), 0)/max(1 - exp(-8.16*sin(beta2)/Z), 1e-9))^3)"

[formula.notes]
assumptions = "γ = f1 (1 − √(sen β2B)/z^0,7) kw con f1 = 0,98 (rodetes radiales). kw = 1 si eps = d1/d2 no supera εLim = exp(−8,16 sen β2B/z); si lo supera, kw = 1 − ((eps − εLim)/(1 − εLim))^3. eps = 0 deja kw = 1."

[[formula]]
id = "design.cu2"
version = 3
validation = "pilot"
module = "design"
title = "Componente tangencial a la salida del rodete"
source = "Gülich 2020, tabla 3.2, ec. (3.2.7), p. 152"
units = "m/s"
range = "-100 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::cu2"

[formula.inputs]
slip = "1"
u2 = "m/s"
cm2 = "m/s"
beta2 = "deg"
tau = "1"

[formula.expr]
value = "u2*slip - tau*cm2/tan(beta2)"

[formula.notes]
assumptions = "c2u = u2 (γ − c2m·τ2/(u2 tan β2B)). τ2 ≥ 1 es el inverso de la fracción libre del paso (τ2 = 1 no descuenta espesor). cm2 es la meridional media, Qth/(π d2 b2); el bloqueo entra solo en el triángulo, no ensancha b2. El deslizamiento afecta solo a u2."

[[formula]]
id = "design.head_coefficient"
version = 1
validation = "pilot"
module = "design"
title = "Coeficiente de altura en el punto de diseño"
source = "Gülich 2020, ec. (3.26), p. 131"
units = "1"
range = "0 .. 1.3"
test = "crates/hm-formula/tests/end_suction.rs::head_coefficient"

[formula.inputs]
nq = "1"

[formula.expr]
value = "1.21*exp(-0.77*nq/100)"

[formula.notes]
assumptions = "ψopt = 1,21 fT e^(−0,77 nq/100) con fT = 1,0, la curva media de la fig. 3.24. Con fT = 1,1 el β2 que pide Euler sube a 18..34°, pero w2/w1 baja de 0,7 entre nq 30 y 60."

[[formula]]
id = "design.relative_outlet_width"
version = 1
validation = "pilot"
module = "design"
title = "Anchura relativa de salida del rodete"
source = "Gülich 2020, ec. (7.1), p. 412"
units = "1"
range = "0 .. 0.4"
test = "crates/hm-formula/tests/end_suction.rs::relative_outlet_width"

[formula.inputs]
nq = "1"

[formula.expr]
value = "0.017 + 0.262*(nq/100) - 0.08*(nq/100)^2 + 0.0093*(nq/100)^3"

[formula.notes]
assumptions = "b2* = b2/d2 medio de la fig. 7.2 para rodetes radiales y semiaxiales; la banda medida es de unos ±20 %."

[[formula]]
id = "design.flow_coefficient"
version = 1
validation = "pilot"
module = "design"
title = "Coeficiente de caudal de salida para una anchura relativa"
source = "Continuidad b2 = Qth/(π d2 cm2) con b2* de Gülich 2020, ec. (7.1), p. 412"
units = "1"
range = "0 .. 0.5"
test = "crates/hm-formula/tests/end_suction.rs::flow_coefficient"

[formula.inputs]
nq = "1"
psi = "1"
eta_v = "1"
b2_star = "1"

[formula.expr]
value = "pi*nq^2*psi^1.5/(3600*eta_v*(2*9.80665)^1.5*b2_star)"

[formula.notes]
assumptions = "φ = cm2/u2 que da b2/d2 = b2*. Sale de b2* = Qth/(π d2² φ u2) con d2 = 60 u2/(π n), u2 = √(2gH/ψ), Qth = Q/ηv y Q = (nq H^0,75/n)²; los números llevan las unidades de nq (rpm, m3/s, m). Con nq = 31,8, ψ = 0,87, ηv = 0,972 y b2* = 0,0652 da φ = 0,13, el valor de D1.A1."

[[formula]]
id = "design.euler_cu2"
version = 1
validation = "pilot"
module = "design"
title = "Componente tangencial que exige la altura"
source = "Gülich 2020, tabla 3.2, ec. (3.2.8), p. 152"
units = "m/s"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::euler_cu2"

[formula.inputs]
H = "m"
eta_h = "1"
u2 = "m/s"

[formula.expr]
value = "g*H/(eta_h*u2)"

[formula.notes]
assumptions = "c2u = gH/(ηh u2) + u1m c1u/u2 sin prerrotación (c1u = 0). El motor elige β2 para que design.cu2 dé este valor (Gülich 2020, p. 412, paso 10)."

[[formula]]
id = "design.viscous_reynolds"
version = 1
validation = "pilot"
module = "design"
title = "Número de Reynolds modificado para la corrección por viscosidad"
source = "Gülich 2020, tabla 13.1, ec. (13.1.1)-(13.1.2), p. 1016; ωs = nq/52,9 (tabla 3.4, ec. 3.4.16)"
units = "1"
range = "1 .. 1e9"
test = "crates/hm-formula/tests/end_suction.rs::viscous_reynolds"

[formula.inputs]
n = "1/s"
d2 = "m"
nu = "m2/s"
nq = "1"

[formula.expr]
value = "2*pi*n*(d2/2)^2/nu*(nq/52.9)^1.5"

[formula.notes]
assumptions = "Re = ω r2²/ν y Re_mod = Re ωs^1,5 fq^0,75 con fq = 1 (rodete de simple aspiración)."

[[formula]]
id = "design.viscous_head_factor"
version = 1
validation = "pilot"
module = "design"
title = "Factor de altura por viscosidad en el punto de diseño"
source = "Gülich 2020, tabla 13.1, ec. (13.1.3), p. 1016"
units = "1"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::viscous_head_factor"

[formula.inputs]
Re_mod = "1"

[formula.expr]
value = "exp(-6.7*Re_mod^(-0.735)*ln(Re_mod))"

[formula.notes]
assumptions = "fH,opt = Re_mod^(−x) con x = 6,7/Re_mod^0,735 (exponente medio). Validez: ν ≤ 4000 cSt y 7 < nq < 50. fQ = fH,opt (ec. 13.1.5)."

[[formula]]
id = "design.viscous_efficiency_factor"
version = 1
validation = "pilot"
module = "design"
title = "Factor de rendimiento por viscosidad en el punto de diseño"
source = "Gülich 2020, tabla 13.1, ec. (13.1.4), p. 1016"
units = "1"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::viscous_efficiency_factor"

[formula.inputs]
Re_mod = "1"

[formula.expr]
value = "exp(-19*Re_mod^(-0.705)*ln(Re_mod))"

[formula.notes]
assumptions = "fη = Re_mod^(−y) con y = 19/Re_mod^0,705 (exponente medio). Validez: ν ≤ 4000 cSt y 7 < nq < 50."

[[formula]]
id = "design.cutwater_ratio"
version = 1
validation = "pilot"
module = "design"
title = "Diámetro mínimo de la lengua de la voluta"
source = "Gülich 2020, tabla 10.2, p. 729"
units = "1"
range = "1 .. 1.5"
test = "crates/hm-formula/tests/end_suction.rs::cutwater_ratio"

[formula.inputs]
nq = "1"
rho = "kg/m3"
H = "m"
rho_ref = "kg/m3"
H_ref = "m"

[formula.expr]
value = "1.03 + 0.1*nq/40 + 0.07*(rho*H)/(rho_ref*H_ref)"

[formula.notes]
assumptions = "dz/d2 ≥ 1,03 + 0,1 nq/nq,Ref + 0,07 ρ Hst/(ρRef HRef) con nq,Ref = 40, ρRef = 1000 kg/m3 y HRef = 1000 m, para pulsaciones de presión bajas. H es la altura por etapa."

[[formula]]
id = "design.diffuser_allowable_angle"
version = 1
validation = "pilot"
module = "design"
title = "Semiángulo admisible de un difusor"
source = "Gülich 2020, ec. (1.44) y fig. 1.20, pp. 30-31"
units = "deg"
range = "0 .. 20"
test = "crates/hm-formula/tests/end_suction.rs::diffuser_allowable_angle"

[formula.inputs]
R1 = "m"
L = "m"

[formula.expr]
value = "16.5*pi/180*sqrt(R1/L)"

[formula.notes]
assumptions = "ϑal = 16,5° √(R1/L), curva a-a de la fig. 1.20 (flujo adherido); vale con flujo de entrada favorable. ϑ es el semiángulo de apertura."

[[formula]]
id = "design.blade_inlet_angle"
version = 1
validation = "pilot"
module = "design"
title = "Ángulo del álabe a la entrada"
source = "Gülich 2020, p. 411 (β1B = β1' + i1) y tabla 3.1"
units = "deg"
range = "5 .. 40"
test = "crates/hm-formula/tests/end_suction.rs::blade_inlet_angle"

[formula.inputs]
c1m = "m/s"
u1 = "m/s"
i1 = "deg"

[formula.expr]
value = "atan(c1m/u1) + i1"

[formula.notes]
assumptions = "β1 = arctan(c1m/(u1 − c1u)) sin prerrotación (c1u = 0). El motor pasa c1m = τ1·cm0, la meridional local en el borde de ataque; i1 = 0..4° para rodetes sin exigencia especial de cavitación."

[[formula]]
id = "design.shockless_flow"
version = 2
validation = "pilot"
module = "design"
title = "Caudal de entrada sin choque"
source = "Gülich 2020, ec. (6.17), p. 342"
units = "m3/s"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::shockless_flow"

[formula.inputs]
d1 = "m"
b1 = "m"
beta1b = "deg"
u1 = "m/s"
eta_v = "1"
tau = "1"

[formula.expr]
value = "eta_v*pi*d1*b1*tan(beta1b)*u1/tau"

[formula.notes]
assumptions = "QSF = fq A1 tan β1B u1a/(τ1 (1 + tan β1B/(τ1 tan α1))) con fq = 1, α1 = 90° (sin prerrotación) y A1 = π d1 b1 por ser cilíndrico el borde de ataque del álabe 2D. τ1 ≥ 1 descuenta el espesor. Se multiplica por ηv para dar caudal de bomba. Con τ1 = 1 no hay bloqueo."

[[formula]]
id = "design.throat_flow"
version = 1
validation = "pilot"
module = "design"
title = "Caudal con w1 igual a la velocidad en la garganta de entrada"
source = "Gülich 2020, ec. (6.18), p. 342"
units = "m3/s"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::throat_flow"

[formula.inputs]
A1 = "m2"
A1q = "m2"
u1m = "m/s"
eta_v = "1"

[formula.expr]
value = "eta_v*A1*u1m/sqrt((A1/A1q)^2 - 1)"

[formula.notes]
assumptions = "QW = fq A1 u1m/√((A1/(zLa A1q))² − 1 + 1/tan α1) con α1 = 90°; A1q es el área de garganta total zLa·A1q. Sin espesor de álabe, zLa A1q = π d1 b1 sen β1B y QW coincide con QSF. Con espesor, el motor pasa zLa A1q = A1 sen β1B/τ1."

[[formula]]
id = "design.volute_matching_flow"
version = 2
validation = "pilot"
module = "design"
title = "Caudal en que la voluta casa con el rodete"
source = "Gülich 2020, ec. (6.19), p. 342"
units = "m3/s"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::volute_matching_flow"

[formula.inputs]
u2 = "m/s"
A2 = "m2"
slip = "1"
A3q = "m2"
eta_v = "1"
beta2 = "deg"
tau = "1"

[formula.expr]
value = "u2*A2*slip/(A2/A3q + tau/(eta_v*tan(beta2)))"

[formula.notes]
assumptions = "Qc = fq u2 A2 γ/(fq A2/(zLe A3q) + τ2/(ηv tan β2B)) con fq = 1 y zLe = 1 (voluta simple). τ2 ≥ 1 descuenta el espesor a la salida; τ2 = 1 no lo descuenta. Es el caudal en que c2u = c3q."

[[formula]]
id = "design.volute_matching_flow_cm"
version = 1
validation = "pilot"
module = "design"
title = "Caudal del rodete en que c3q = c2, con la meridional"
source = "Gülich 2020, ec. (6.22a), p. 344"
units = "m3/s"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::volute_matching_flow_cm"

[formula.inputs]
u2 = "m/s"
A2 = "m2"
slip = "1"
a = "1"
tau = "1"
beta2 = "deg"

[formula.expr]
value = "u2*A2*slip*(sqrt(a^2 - 1) - tau/tan(beta2))/(a^2 - 1 - (tau/tan(beta2))^2)"

[formula.notes]
assumptions = "QLa,c = u2 fq A2 γ (√(a² − 1) − τ2/tan β2B)/(a² − 1 − (τ2/tan β2B)²) con a = fq A2 QLe/(zLe A3q QLa). Es el caudal del rodete en que la velocidad en la garganta c3q iguala a c2 (incluye c2m, que 6.19 desprecia y que solo vale con nq bajo). Para pasarlo al caudal de la bomba se multiplica por QLe/QLa. Exige a² − 1 > (τ2/tan β2B)²; si no, no hay cruce."

[[formula]]
id = "design.recirculation_onset"
version = 1
validation = "pilot"
module = "design"
title = "Inicio estimado de la recirculación a la entrada"
source = "Gülich 2020, p. 237 (q*RB = 0,4..0,75 ± 0,1 de nq 10 a 300); interpolación del motor"
units = "1"
range = "0.4 .. 0.75"
test = "crates/hm-formula/tests/end_suction.rs::recirculation_onset"

[formula.inputs]
nq = "1"

[formula.expr]
value = "max(0.4, min(0.75, 0.4 + 0.35*ln(nq/10)/ln(30)))"

[formula.notes]
assumptions = "Gülich da solo el intervalo, creciente con nq, y advierte que ninguna correlación simple lo predice bien; la interpolación logarítmica entre nq 10 y 300 es del motor. Datos de ensayo en la tabla D5.1: nq 26 → 0,57, nq 29 → 0,62..0,67, nq 90 → 0,8."

[[formula]]
id = "design.leakage_volumetric_efficiency"
version = 1
validation = "pilot"
module = "design"
title = "Rendimiento volumétrico por la fuga estimada"
source = "Gülich 2020, tabla 3.10, ec. (3.10.3) y (3.10.4), p. 164"
units = "1"
range = "0.8 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::leakage_volumetric_efficiency"

[formula.inputs]
nq = "1"

[formula.expr]
value = "1/(1 + 4.1*nq^(-1.6))"

[formula.notes]
assumptions = "Qsp/Qopt = 4,1/nq^1,6 sin detalle de los anillos, y ηvol = Q/(Q + Qsp) sin compensación axial (QE = 0) ni etapas (Qs3 = 0). Es una primera aproximación para contrastar ηv."

[[formula]]
id = "design.volumetric_efficiency_gulich"
version = 1
validation = "pilot"
module = "design"
title = "Rendimiento volumétrico por la fuga del anillo, Gülich 3.5.10"
source = "Gülich 2020, tabla 3.5, ec. (3.5.9) y (3.5.10), p. 155"
units = "1"
range = "0.5 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::volumetric_efficiency_gulich"

[formula.inputs]
nq = "1"
zH = "1"
a = "1"
m = "1"

[formula.expr]
value = "1/(1 + a*zH*exp(-m*ln(nq)))"

[formula.notes]
assumptions = "Qsp/Qopt = a·zH/nq^m y ηv = Q/(Q + Qsp) con QE = Qs3 = Qh = 0 (3.5.9). (a, m) = (4,1, 1,6) con nq < 27 y (0,15, 0,6) con nq ≥ 27; zH = 2 con agujeros de equilibrio y 1 sin ellos. Lo elige el motor, que pasa a y m. El exponente es variable, así que se escribe nq^−m como exp(−m·ln nq)."

[[formula]]
id = "design.mechanical_efficiency_estimate"
version = 1
validation = "pilot"
module = "design"
title = "Rendimiento mecánico estimado"
source = "Gülich 2020, tabla 3.10, ec. (3.10.14), p. 165"
units = "1"
range = "0.9 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::mechanical_efficiency_estimate"

[formula.inputs]
Q = "m3/s"
n = "1/s"
Q_ref = "m3/s"
n_ref = "1/s"

[formula.expr]
value = "1 - 0.0045*(Q_ref/Q)^0.4*(n_ref/n)^0.3"

[formula.notes]
assumptions = "Pm/Pu = 0,0045/η·(QRef/Q)^0,4·(nRef/n)^0,3 con QRef = 1 m3/s y nRef = 1500 rpm, así que Pm/P = 0,0045·(QRef/Q)^0,4·(nRef/n)^0,3 y ηm = 1 − Pm/P."

[[formula]]
id = "design.disk_reynolds"
version = 1
validation = "pilot"
module = "design"
title = "Número de Reynolds del disco del rodete"
source = "Gülich 2020, tabla 3.10, ec. (3.10.2), p. 164"
units = "1"
range = "1e5 .. 1e9"
test = "crates/hm-formula/tests/end_suction.rs::disk_reynolds"

[formula.inputs]
n = "1/s"
d2 = "m"
nu = "m2/s"

[formula.expr]
value = "2*pi*n*(d2/2)^2/nu"

[formula.notes]
assumptions = "Re = u2 r2/ν = ω r2²/ν, con n en revoluciones por segundo."

[[formula]]
id = "design.disk_friction_coefficient"
version = 1
validation = "pilot"
module = "design"
title = "Coeficiente de rozamiento de discos"
source = "Gülich 2020, tabla 3.10, ec. (3.10.8) y (3.10.9), p. 164"
units = "1"
range = "1e-4 .. 5e-3"
test = "crates/hm-formula/tests/end_suction.rs::disk_friction_coefficient"

[formula.inputs]
Re = "1"
k0 = "1"

[formula.expr]
value = "0.0625/Re^0.2*(1 - k0)^1.75"

[formula.notes]
assumptions = "Solo el término turbulento de la ec. 3.10.9: con Re > 1e6 el término laminar π r2/(2 Re sax) es despreciable. Paredes lisas (fR = 1), sin fuga por las cámaras laterales (fL = 1), sin álabes dorsales (fRS = 1) y agua (ftherm ≈ 1). k0 = 0,5 corresponde a cámaras abiertas (rw = r2, tax = 0, ec. 3.10.8). La rugosidad de fundición sube kRR: queda para cuando se conozca."

[[formula]]
id = "design.disk_friction_ratio"
version = 1
validation = "pilot"
module = "design"
title = "Pérdida por rozamiento de discos frente a la potencia útil"
source = "Gülich 2020, tabla 3.10, ec. (3.10.13), p. 165"
units = "1"
range = "0 .. 0.5"
test = "crates/hm-formula/tests/end_suction.rs::disk_friction_ratio"

[formula.inputs]
k_rr = "1"
f_geo = "1"
nq = "1"
psi = "1"

[formula.expr]
value = "31680*k_rr*f_geo/(nq^2*psi^2.5)"

[formula.notes]
assumptions = "PRR/Pu con fq = 1 (una entrada) y fgeo ≈ 1,22 para rodetes radiales típicos. Crece con 1/nq²: con nq ≈ 16 ronda el 9 % y con nq ≈ 30 el 3..6 %."

[[formula]]
id = "design.statistical_hydraulic_efficiency"
version = 1
validation = "pilot"
module = "design"
title = "Rendimiento hidráulico estadístico"
source = "Gülich 2020, tabla 3.9, ec. (3.9.6), p. 163"
units = "1"
range = "0.5 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::statistical_hydraulic_efficiency"

[formula.inputs]
Q = "m3/s"
Q_ref = "m3/s"
nq = "1"

[formula.expr]
value = "1 - 0.055*exp(ln(Q_ref/Q)*0.08*(Q_ref/Q)^0.15*(45/nq)^0.06) - 0.2*(0.26 - log10(nq/25))^2*(Q_ref/Q)^0.1"

[formula.notes]
assumptions = "Bombas radiales de una etapa con nq ≤ 100, Q ≥ 0,005 m3/s y Q ≤ 1 m3/s (a = 1 en el exponente). QRef = 1 m3/s. Es una media estadística de bombas bien diseñadas; la incertidumbre de η es ±0,2(1 − ηopt) (ec. 3.9.10)."

[[formula]]
id = "design.loss_efficiency"
version = 1
validation = "pilot"
module = "design"
title = "Rendimiento total por análisis de pérdidas"
source = "Gülich 2020, tabla 3.10, ec. (3.10.15) despejada para η, p. 165"
units = "1"
range = "0.3 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::loss_efficiency"

[formula.inputs]
eta_h = "1"
eta_v = "1"
eta_m = "1"
disk_ratio = "1"

[formula.expr]
value = "eta_h*eta_v*eta_m/(1 + eta_h*eta_v*disk_ratio)"

[formula.notes]
assumptions = "De ηh = η/(ηvol{1 − η[PRR/Pu + Pm/Pu]}) con Pm/Pu = (1 − ηm)/η: η = ηh ηvol ηm/(1 + ηh ηvol PRR/Pu). ηm es el rendimiento mecánico sin el rozamiento de discos (ec. 3.10.14)."

[[formula]]
id = "design.disk_friction_loss"
version = 1
validation = "pilot"
module = "design"
title = "Pérdida por rozamiento de discos"
source = "Gülich 2020, tabla 3.10, ec. (3.10.13), p. 165"
units = "W"
range = "0 .. 100000000"
test = "crates/hm-formula/tests/end_suction.rs::disk_friction_loss"

[formula.inputs]
P_hyd = "W"
disk_ratio = "1"

[formula.expr]
value = "P_hyd*disk_ratio"

[formula.notes]
assumptions = "PRR = Pu·(PRR/Pu), con Pu la potencia útil ρgQH."

[[formula]]
id = "design.bearing_seal_loss"
version = 1
validation = "pilot"
module = "design"
title = "Pérdida en cojinetes y cierre"
source = "Gülich 2020, tabla 3.10, ec. (3.10.14) y (3.10.15), p. 165"
units = "W"
range = "0 .. 100000000"
test = "crates/hm-formula/tests/end_suction.rs::bearing_seal_loss"

[formula.inputs]
P_shaft = "W"
eta_m = "1"

[formula.expr]
value = "P_shaft*(1 - eta_m)"

[formula.notes]
assumptions = "Pm = P·(1 − ηm), con ηm sin el rozamiento de discos, que va aparte en design.disk_friction_loss."

[[formula]]
id = "mech.shaft_min_diameter"
version = 1
validation = "reference"
module = "mech"
title = "Diámetro mínimo del eje por torsión"
source = "Srinivasan 2017, §4.14, p. 116; Diseños D1.A1 (p. 415) y D1.B (pp. 435-438)"
units = "m"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::shaft_min_diameter"

[formula.inputs]
T = "N*m"
tau = "Pa"

[formula.expr]
value = "(16*T/(pi*tau))^(1/3)"

[formula.notes]
assumptions = "Torsión pura: π ds³ τ/16 = T, con τ = fu/FS (FS 2..6 según Srinivasan; 8 en D1.A1). T es el par con la sobrecarga de potencia (10..15 %). No incluye flexión por el empuje radial ni velocidades críticas. D1.A1: T = 15,56 N·m, τ = 180/8 MPa → 15,212 mm; D1.B: T = 369,24 N·m, τ = 40,4/4 MPa → 57,10 mm (el libro escribe 58,7 mm; errata aritmética, sus datos dan 57,10)."

[[formula]]
id = "mech.hub_diameter"
version = 1
validation = "reference"
module = "mech"
title = "Diámetro del cubo del rodete"
source = "Srinivasan 2017, ec. (4.48), p. 116; Diseños D1.A1 (p. 415) y D1.B (pp. 435-438)"
units = "m"
range = "0 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::hub_diameter"

[formula.inputs]
ds = "m"
k_hub = "1"

[formula.expr]
value = "k_hub*ds"

[formula.notes]
assumptions = "dh = (1,2..1,3)·ds según el tamaño de la bomba, con sitio para la chaveta. D1.A1: 1,25 × 25 mm = 31,25 mm; D1.B: 1,3 × 60 mm = 78 mm."

[[formula]]
id = "mech.radial_shutoff_coefficient"
version = 1
validation = "pilot"
module = "mech"
title = "Coeficiente de empuje radial a válvula cerrada, voluta simple"
source = "Gülich 2020, fig. 9.46, curva 1 (tabla 9.7 (2)), p. 705"
units = "1"
range = "0.08 .. 0.4"
test = "crates/hm-formula/tests/end_suction.rs::radial_shutoff_coefficient"

[formula.inputs]
nq = "1"

[formula.expr]
value = "3.730e-8*nq^4 - 7.274e-6*nq^3 + 3.610e-4*nq^2 + 2.041e-3*nq + 3.944e-2"

[formula.notes]
assumptions = "Ajuste de Gülich a la curva 1 (holguras de los anillos según la ec. 3.12), rodete de una entrada (nq,tot = nq). La figura cubre nq ≈ 10..95; fuera de ese intervalo el motor evalúa en el extremo. Con holguras dobles o desgaste, la curva 2 da coeficientes mayores."

[[formula]]
id = "mech.radial_thrust_coefficient"
version = 1
validation = "pilot"
module = "mech"
title = "Coeficiente de empuje radial a caudal parcial y sobrecarga, voluta simple"
source = "Gülich 2020, tabla 9.7 (1), p. 704"
units = "1"
range = "0 .. 0.5"
test = "crates/hm-formula/tests/end_suction.rs::radial_thrust_coefficient"

[formula.inputs]
q = "1"
kR0 = "1"
kR_opt = "1"

[formula.expr]
value = "max((kR0 - kR_opt)*(1 - q^2) + kR_opt, kR_opt*q^2)"

[formula.notes]
assumptions = "q = Q/Q de diseño de la voluta. Para 0 < q < 1, kR = (kR0 − kR,opt)(1 − q²) + kR,opt; para q > 1, kR = kR,opt·q² (la tabla admite kR,opt en lugar del factor 0,09). El máximo de los dos tramos es cada uno en su intervalo cuando kR0 ≥ kR,opt."

[[formula]]
id = "mech.radial_thrust"
version = 1
validation = "pilot"
module = "mech"
title = "Empuje radial estacionario"
source = "Gülich 2020, tabla 9.7 (1), p. 704"
units = "N"
range = "0 .. 10000000"
test = "crates/hm-formula/tests/end_suction.rs::radial_thrust"

[formula.inputs]
kR = "1"
rho = "kg/m3"
H = "m"
d2 = "m"
b2tot = "m"

[formula.expr]
value = "kR*rho*g*H*d2*b2tot"

[formula.notes]
assumptions = "H es la altura en el caudal considerado y b2tot la anchura a la salida con las tapas del rodete."

[[formula]]
id = "mech.axial_thrust_estimate"
version = 1
validation = "pilot"
module = "mech"
title = "Estimación del empuje axial hidráulico"
source = "Gülich 2020, tabla 9.2, ec. (9.2.12), p. 656"
units = "N"
range = "0 .. 10000000"
test = "crates/hm-formula/tests/end_suction.rs::axial_thrust_estimate"

[formula.inputs]
f_ax = "1"
rho = "kg/m3"
H = "m"
dsp = "m"
dD = "m"

[formula.expr]
value = "f_ax*rho*g*H*pi/4*(dsp^2 - dD^2)"

[formula.notes]
assumptions = "Estimación para bombas radiales y semiaxiales sin compensación, con f_ax = 0,7..0,9. dsp es el diámetro del anillo de la tapa anterior y dD el del cierre del eje en la tapa posterior. No incluye la fuerza de cantidad de movimiento ni la del eje (ec. 9.2.9 y 9.2.10)."

[[formula]]
id = "mech.blade_thickness_ratio"
version = 1
validation = "pilot"
module = "mech"
title = "Espesor relativo del álabe, rodete cerrado"
source = "Gülich 2020, tabla 14.3, ec. (T14.3.1), p. 1094"
units = "1"
range = "0.005 .. 0.1"
test = "crates/hm-formula/tests/end_suction.rs::blade_thickness_ratio"

[formula.inputs]
z = "1"
u2 = "m/s"
u_ref = "m/s"
nq = "1"

[formula.expr]
value = "0.015*(7/z)^0.4*(1 + 0.25*(u2/u_ref)^2)*(1 + 0.5*(nq/100)^2)"

[formula.notes]
assumptions = "e* = e/d2, espesor nominal sin perfilar, con uRef = 100 m/s, nq,Ref = 100 y zRef = 7; válido para 1..10 álabes. Gülich añade como mínimos e = 0,015·d2 en rodetes fundidos y el que exija el proceso de fundición (3..5 mm, p. 413)."

[[formula]]
id = "mech.shroud_thickness"
version = 1
validation = "pilot"
module = "mech"
title = "Espesor de las tapas del rodete cerrado"
source = "Gülich 2020, tabla 14.3, ec. (T14.3.4), p. 1094"
units = "m"
range = "0 .. 0.2"
test = "crates/hm-formula/tests/end_suction.rs::shroud_thickness"

[formula.inputs]
e = "m"

[formula.expr]
value = "1.25*e"

[formula.notes]
assumptions = "eRS = 1,25·e con e el espesor nominal del álabe."

[[formula]]
id = "mech.seal_clearance"
version = 1
validation = "pilot"
module = "mech"
title = "Holgura diametral del anillo de desgaste"
source = "Gülich 2020, ec. (3.12), p. 110"
units = "m"
range = "0 .. 0.01"
test = "crates/hm-formula/tests/end_suction.rs::seal_clearance"

[formula.inputs]
dsp = "m"
d_ref = "m"

[formula.expr]
value = "0.004*dsp*(d_ref/dsp)^0.53"

[formula.notes]
assumptions = "Δd = 2s, con dRef = 100 mm. Corresponde aproximadamente a las holguras mínimas de API 610 más la mitad de las tolerancias H7/h7; las ejecutadas quedan en ±30 %. Por encima de 260 °C o con materiales propensos al gripado API 610 añade 0,125 mm, que aquí no se incluyen."

[[formula]]
id = "mech.driver_power"
version = 1
validation = "pilot"
module = "mech"
title = "Potencia mínima del motor"
source = "API 610 (ISO 13709), margen del motor sobre la potencia en el punto nominal"
units = "W"
range = "0 .. 100000000"
test = "crates/hm-formula/tests/end_suction.rs::driver_power"

[formula.inputs]
P = "W"
margin = "1"

[formula.expr]
value = "P*margin"

[formula.notes]
assumptions = "margin = 1,25 hasta 22 kW, 1,15 de 22 a 55 kW y 1,10 por encima (API 610). El motor es la potencia normalizada de IEC 60072-1 inmediatamente mayor."

[[formula]]
id = "design.zero_head_flow_ratio"
version = 2
validation = "pilot"
module = "design"
title = "Caudal de altura teórica nula frente al de diseño"
source = "Gülich 2020, tabla 3.2, ec. (3.2.7), p. 152, y §4.3.5, p. 194"
units = "1"
range = "1 .. 30"
test = "crates/hm-formula/tests/end_suction.rs::zero_head_flow_ratio"

[formula.inputs]
slip = "1"
beta2 = "deg"
phi = "1"
tau = "1"

[formula.expr]
value = "slip*tan(beta2)/(phi*tau)"

[formula.notes]
assumptions = "Hth = u2·c2u/g con c2u = u2(γ − φ·q·τ2/tan β2B) y cm2 proporcional al caudal (ηv constante): Hth se anula en q0 = γ·tan β2B/(φ·τ2). Sin prerrotación a la entrada (c1u = 0) y con el γ y el τ2 del punto de diseño. τ2 = 1 no descuenta espesor."

[[formula]]
id = "design.design_head_slope"
version = 1
validation = "pilot"
module = "design"
title = "Pendiente adimensional de H(Q) en el punto de diseño"
source = "Gülich 2020, §4.3.5, p. 194"
units = "1"
range = "-10 .. 0"
test = "crates/hm-formula/tests/end_suction.rs::design_head_slope"

[formula.inputs]
q0 = "1"

[formula.expr]
value = "-1/(q0 - 1)"

[formula.notes]
assumptions = "Observación empírica de Gülich: en el punto óptimo la curva Q-H es tangente a la recta que pasa por Q(Hth = 0) y (Qopt, Hopt). En variables H/Hd y Q/Qd la pendiente es −1/(q0 − 1)."

[[formula]]
id = "design.curve_head_ratio"
version = 1
validation = "pilot"
module = "design"
title = "Altura de la curva frente a la de diseño"
source = "Gülich 2020, §4.3.5, p. 194 (H0 de la ec. 3.28 y tangente en el óptimo)"
units = "1"
range = "0 .. 2"
test = "crates/hm-formula/tests/end_suction.rs::curve_head_ratio"

[formula.inputs]
h0 = "1"
slope = "1"
q = "1"

[formula.expr]
value = "h0 + (2*(1 - h0) - slope)*q + (slope - (1 - h0))*q^2"

[formula.notes]
assumptions = "Parábola en q = Q/Qd que vale h0 = H0/Hd en q = 0, 1 en el punto de diseño y tiene allí la pendiente de la tangente. Gülich deja la interpolación entre Q = 0 y la zona sin recirculación «según la experiencia»; la parábola es la forma del motor. Puede tener un máximo con q > 0: curva inestable."

[[formula]]
id = "design.npsh3_inlet"
version = 1
validation = "pilot"
module = "design"
title = "NPSH3 por las velocidades de entrada"
source = "Gülich 2020, ec. (6.10) y (6.11), p. 337, y tabla D6.3, p. 338"
units = "m"
range = "0 .. 100"
test = "crates/hm-formula/tests/end_suction.rs::npsh3_inlet"

[formula.inputs]
c1m = "m/s"
u1 = "m/s"
lambda_c = "1"
lambda_w = "1"
g = "m/s2"

[formula.expr]
value = "(lambda_c*c1m^2 + lambda_w*(c1m^2 + u1^2))/(2*g)"

[formula.notes]
assumptions = "NPSH3 = λc·c1m²/2g + λw·w1²/2g con w1² = c1m² + u1² (entrada sin prerrotación) en el diámetro exterior del borde de ataque. λc = 1,1 con entrada axial; λw = 0,1..0,3 para entrada sin choque, y el motor toma 0,2. Depende del ojo: d1 fija u1 y el área fija c1m."

[[formula]]
id = "design.seal_rotation_factor"
version = 1
validation = "pilot"
module = "design"
title = "Factor de rotación del fluido delante del anillo de desgaste"
source = "Gülich 2020, tabla 3.7, ec. (3.7.2) y (3.7.3), p. 157"
units = "1"
range = "0.2 .. 0.9"
test = "crates/hm-formula/tests/end_suction.rs::seal_rotation_factor"

[formula.inputs]
u2 = "m/s"
d2 = "m"
nu = "m2/s"
s = "m"
dsp = "m"
L = "m"

[formula.expr]
value = "0.9*((u2*d2/(2*nu))^0.3*s*dsp/d2^2*sqrt(s/L))^0.087"

[formula.notes]
assumptions = "Fuga radial hacia dentro (anillo delantero): k = 0,9·ysp^0,087 con ysp = Re_u2^0,3·s·dsp/d2²·√(s/Lsp) y Re_u2 = u2·r2/ν. s es la holgura radial."

[[formula]]
id = "design.seal_pressure_difference"
version = 1
validation = "pilot"
module = "design"
title = "Altura que empuja la fuga por el anillo delantero"
source = "Gülich 2020, tabla 3.7, ec. (3.7.1) y (3.7.3), p. 157"
units = "m"
range = "0 .. 1000"
test = "crates/hm-formula/tests/end_suction.rs::seal_pressure_difference"

[formula.inputs]
RG = "1"
H = "m"
k = "1"
u2 = "m/s"
g = "m/s2"
dsp = "m"
d2 = "m"

[formula.expr]
value = "RG*H - k^2*u2^2/(2*g)*(1 - dsp^2/d2^2)"

[formula.notes]
assumptions = "Hp = RG·H. El motor pasa RG = (1 − cu2/(2·u2)), limitado a 0,2..0,95 (ec. 3.7.1: 1 − cu2/(2·u2) para entrada sin prerrotación). La constante 0,75 era el valor de nq < 40 en la p. 111. La rotación del fluido en la cámara lateral baja la presión hasta el anillo en k²·u2²/2g·(1 − dsp²/d2²)."

[[formula]]
id = "design.seal_friction_coefficient"
version = 1
validation = "pilot"
module = "design"
title = "Coeficiente de rozamiento en la holgura del anillo"
source = "Gülich 2020, tabla 3.7, ec. (3.7.9), (3.7.11), (3.7.12) y (3.7.13), p. 157"
units = "1"
range = "0.001 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::seal_friction_coefficient"

[formula.inputs]
s = "m"
cax = "m/s"
nu = "m2/s"
eps = "m"
usp = "m/s"

[formula.expr]
value = "max(0.31/(log10(0.135*eps/s + 6.5/(2*s*cax/nu)))^2, 96/(2*s*cax/nu))*(1 + 0.19*(usp/cax)^2)^0.375"

[formula.notes]
assumptions = "λ0 = máx(λ turbulento con A = 0,135·ε/s; 96/Re laminar sin excentricidad), Re = 2·s·cax/ν, y la rotación por Re_u/Re = usp/cax con el exponente turbulento. Junta lisa sin ranuras."

[[formula]]
id = "design.seal_axial_velocity"
version = 1
validation = "pilot"
module = "design"
title = "Velocidad axial en la holgura del anillo"
source = "Gülich 2020, tabla 3.7, ec. (3.7.6) y (3.7.8), p. 157"
units = "m/s"
range = "0 .. 200"
test = "crates/hm-formula/tests/end_suction.rs::seal_axial_velocity"

[formula.inputs]
g = "m/s2"
dH = "m"
zeta = "1"
lambda = "1"
L = "m"
s = "m"

[formula.expr]
value = "sqrt(2*g*dH/(zeta + lambda*L/(2*s)))"

[formula.notes]
assumptions = "Junta de una sola cámara: ζEA = 1..1,2 de pérdida de entrada y salida, y el motor toma 1,1. λ depende de cax: el motor itera."

[[formula]]
id = "design.seal_leakage_flow"
version = 1
validation = "pilot"
module = "design"
title = "Caudal de fuga por el anillo delantero"
source = "Gülich 2020, tabla 3.7, ec. (3.7.7), p. 157"
units = "m3/s"
range = "0 .. 10"
test = "crates/hm-formula/tests/end_suction.rs::seal_leakage_flow"

[formula.inputs]
dsp = "m"
s = "m"
cax = "m/s"

[formula.expr]
value = "pi*dsp*s*cax"

[formula.notes]
assumptions = "Qsp = π·dsp·s·cax."

[[formula]]
id = "design.seal_volumetric_efficiency"
version = 1
validation = "pilot"
module = "design"
title = "Rendimiento volumétrico por la fuga del anillo delantero"
source = "Gülich 2020, tabla 3.10, ec. (3.10.4), p. 164"
units = "1"
range = "0.5 .. 1"
test = "crates/hm-formula/tests/end_suction.rs::seal_volumetric_efficiency"

[formula.inputs]
Q = "m3/s"
Qsp = "m3/s"

[formula.expr]
value = "Q/(Q + Qsp)"

[formula.notes]
assumptions = "Solo el anillo delantero (QE = 0): sin agujeros de equilibrio ni segundo anillo."
