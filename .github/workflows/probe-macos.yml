name: Probe macOS

# Prueba temporal: ¿qué pools de runners de macOS aceptan trabajos? Se borra después.
on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-15-intel, macos-latest]
    steps:
      - run: uname -m && sw_vers
