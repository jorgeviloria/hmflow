[package]
name = "hm-ui"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Jorge Viloria and contributors"]
publish = false

[workspace]

[[bin]]
name = "hmflow"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["canvas"] }
hm-core = { path = "../hm-core" }
hm-design = { path = "../hm-design" }
hm-formula = { path = "../hm-formula" }
hm-units = { path = "../hm-units" }
