[package]
name = "hm-ui-egui"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Jorge Viloria and contributors"]
publish = false
description = "Interfaz de HidroMac Flow con egui."

# Workspace propio: todavía no entra en el CI principal.
[workspace]

[[bin]]
name = "hmflow-egui"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui_plot = "0.38"
hm-core = { path = "../hm-core" }
hm-design = { path = "../hm-design" }
hm-engine = { path = "../hm-engine" }
hm-formula = { path = "../hm-formula" }
hm-project = { path = "../hm-project" }
hm-units = { path = "../hm-units" }
rfd = "0.17.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
